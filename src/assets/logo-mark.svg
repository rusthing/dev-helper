<!-- 侧边栏品牌标记：x2-blue 的机器人本体，去掉蓝色圆角底块，viewBox 裁到机器人身上。
     配色仍出自 x2-blue（底块渐变 → 机身，脸部白 → 五官），所以浅色和深色主题都能用：
     蓝机身 + 白五官，在 #fff 和 #22262b 上对比都够，不用按主题换文件。
     改配色请以 icon-designs/robot/build.mjs 为准，别单独改这里 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="172 164 684 634">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E9BE8"/>
      <stop offset="1" stop-color="#1868BC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#0B2B4A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2B4A" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="head">
      <rect x="244" y="330" width="536" height="392" rx="148"/>
    </clipPath>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2B4A" flood-opacity="0.3"/>
    </filter>
    <filter id="lamp" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 整体歪一点头，和 .app 图标保持同一个姿态 -->
  <g filter="url(#ds)" transform="translate(0,8) rotate(-5 512 512)">
    <line x1="512" y1="336" x2="512" y2="268" stroke="#1868BC" stroke-width="24" stroke-linecap="round"/>
    <circle cx="512" cy="238" r="46" fill="#4EC9B0" opacity="0.2"/>
    <circle cx="512" cy="238" r="30" fill="#4EC9B0" filter="url(#lamp)"/>

    <rect x="188" y="462" width="66" height="140" rx="33" fill="#1868BC"/>
    <rect x="770" y="462" width="66" height="140" rx="33" fill="#1868BC"/>

    <rect x="244" y="330" width="536" height="392" rx="148" fill="url(#body)"/>
    <rect x="244" y="330" width="536" height="200" fill="url(#gloss)" clip-path="url(#head)"/>
    <rect x="244" y="330" width="536" height="392" fill="url(#shade)" clip-path="url(#head)"/>

    <!-- 五官用白色：机身已经是蓝的，白比深蓝更跳。
         笔画比 .app 图标粗 2px（38→40 / 26→28），小尺寸下才不吃掉 -->
    <path d="M424 452 L370 524 L424 596" fill="none" stroke="#FFFFFF" stroke-width="40"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M600 452 L654 524 L600 596" fill="none" stroke="#FFFFFF" stroke-width="40"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M462 646 Q512 668 562 646" fill="none" stroke="#FFFFFF" stroke-width="28"
          stroke-linecap="round"/>
  </g>
</svg>
