<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#1B1F78"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3DBF6"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#070A24" flood-opacity="0.36"/>
    </filter>
    <filter id="lamp" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <g filter="url(#ds)" transform="translate(0,30)">
    <!-- 天线 -->
    <line x1="512" y1="336" x2="512" y2="268" stroke="#E7ECFF" stroke-width="24" stroke-linecap="round"/>
    <circle cx="512" cy="238" r="54" fill="#4AE3A6" opacity="0.22"/>
    <circle cx="512" cy="238" r="32" fill="#4AE3A6" filter="url(#lamp)"/>

    <!-- 耳朵 -->
    <rect x="188" y="462" width="66" height="140" rx="30" fill="#C3CDF0"/>
    <rect x="770" y="462" width="66" height="140" rx="30" fill="#C3CDF0"/>

    <!-- 头 -->
    <rect x="244" y="330" width="536" height="392" rx="130" fill="url(#face)"/>

    <!-- 眼睛：<> -->
    <path d="M424 452 L370 524 L424 596" fill="none" stroke="#191D33" stroke-width="38"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M600 452 L654 524 L600 596" fill="none" stroke="#191D33" stroke-width="38"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 嘴 -->
    <rect x="452" y="640" width="120" height="30" rx="15" fill="#191D33"/>
  </g>
</svg>
