<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#1D1D1D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#FE8019" stop-opacity="0"/>
      <stop offset="1" stop-color="#FE8019" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBDBB2"/>
      <stop offset="1" stop-color="#D5C69B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="head">
      <rect x="244" y="330" width="536" height="392" rx="148"/>
    </clipPath>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="lamp" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#halo)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <!-- 极细的浅色描边：深色图标贴在深色壁纸上时，靠它保住圆角轮廓 -->
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 整体歪一点头：比正襟危坐更有性格，也破了「方正」的感觉 -->
  <g filter="url(#ds)" transform="translate(0,8) rotate(-5 512 512)">
    <line x1="512" y1="336" x2="512" y2="268" stroke="#EBDBB2" stroke-width="24" stroke-linecap="round"/>
    <circle cx="512" cy="238" r="54" fill="#FE8019" opacity="0.22"/>
    <circle cx="512" cy="238" r="32" fill="#FE8019" filter="url(#lamp)"/>

    <rect x="188" y="462" width="66" height="140" rx="33" fill="#3C3836"/>
    <rect x="770" y="462" width="66" height="140" rx="33" fill="#3C3836"/>

    <rect x="244" y="330" width="536" height="392" rx="148" fill="url(#face)"/>
    <!-- 头顶柔光 + 下巴阴影：一点体积感，别让它像张纸片 -->
    <rect x="244" y="330" width="536" height="200" fill="url(#gloss)" clip-path="url(#head)"/>
    <rect x="244" y="330" width="536" height="392" fill="url(#shade)" clip-path="url(#head)"/>

    <!-- 腮红：放在眼角下方、嘴角两侧，别贴着眼睛 -->
    <ellipse cx="338" cy="630" rx="34" ry="20" fill="#FB4934" opacity="0.5"/>
    <ellipse cx="686" cy="630" rx="34" ry="20" fill="#FB4934" opacity="0.5"/>

    <path d="M424 452 L370 524 L424 596" fill="none" stroke="#282828" stroke-width="38"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M600 452 L654 524 L600 596" fill="none" stroke="#282828" stroke-width="38"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 浅弧当嘴：比一条直线软一点 -->
    <path d="M462 646 Q512 668 562 646" fill="none" stroke="#282828" stroke-width="26"
          stroke-linecap="round"/>
  </g>
</svg>
